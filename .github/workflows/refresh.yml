name: Refresh Vertex region matrix

on:
  schedule:
    - cron: '0 5 * * 1,3,5'   # Mon, Wed, Fri at 05:00 UTC (10:30 IST)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

env:
  # Flip to 'true' to make ANY scrape failure fail the job outright.
  # Left 'false' so known-broken pages surface as warnings without a permanently red build.
  STRICT_FAILURES: 'false'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1 || true
          # Pinned: 'latest' meant an upstream release could break a scheduled run.
          npm install playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Show what's in the repo
        run: |
          echo "--- repo root ---"
          ls -la
          echo "--- everything, 2 levels deep ---"
          find . -maxdepth 2 -not -path './.git/*' -not -path './node_modules*' | sort

      - name: Scrape model pages
        run: |
          if [ ! -f scrape.mjs ]; then
            echo "::error::scrape.mjs is not at the repo root. See the file listing above for where it actually is."
            exit 1
          fi
          node scrape.mjs

      - name: Promote discovered models
        run: node promote-discovered.mjs

      - name: Build artifact data
        run: node build-artifact-data.mjs

      - name: Report scrape failures
        run: |
          node -e '
            const fs = require("fs");
            const r = JSON.parse(fs.readFileSync("regions.json", "utf8"));
            const f = r.failures || [];
            const models = r.models || {};
            const disc = r.discovered || [];

            // promote-discovered.mjs flips a promoted model to status:"known".
            // Split the discovered list on that, so an auto-promoted model is never
            // reported as still needing a manual models.json edit.
            const promoted = disc.filter(id => (models[id] || {}).status === "known");
            const awaiting = disc.filter(id => (models[id] || {}).status !== "known");

            const sum = process.env.GITHUB_STEP_SUMMARY;
            let md = "## Vertex region matrix\n\n";
            md += `- fetchedAt: \`${r.fetchedAt}\`\n`;
            md += `- models resolved: **${Object.keys(models).length}**\n`;
            md += `- scrape failures: **${f.length}**\n`;
            md += `- newly discovered: **${disc.length}** (auto-promoted ${promoted.length}, awaiting review ${awaiting.length})\n\n`;

            if (f.length) {
              md += "### Failures (these models kept their PREVIOUS data)\n\n";
              md += "| model | error | url |\n|---|---|---|\n";
              for (const x of f) {
                console.log(`::warning title=Scrape failed::${x.model} — ${x.error} (${x.url})`);
                md += `| \`${x.model}\` | ${x.error} | ${x.url} |\n`;
              }
              md += "\n";
            }

            if (promoted.length) {
              md += "### Auto-promoted into models.json (no action needed)\n\n";
              for (const id of promoted) {
                console.log(`::notice title=Model auto-promoted::${id} — now tracked, no manual edit needed`);
                md += `- \`${id}\`\n`;
              }
              md += "\n";
            }

            if (awaiting.length) {
              md += "### Awaiting review (status:\"new\" — the hourly task will queue these)\n\n";
              for (const id of awaiting) {
                console.log(`::notice title=New model awaiting review::${id} — status:"new", not auto-enabled`);
                md += `- \`${id}\`\n`;
              }
              md += "\n";
            }

            if (sum) fs.appendFileSync(sum, md);
            if (f.length && process.env.STRICT_FAILURES === "true") {
              console.log(`::error::${f.length} model page(s) failed to scrape and STRICT_FAILURES is true.`);
              process.exit(1);
            }
          '

      - name: Commit if anything changed
        run: |
          git config user.name  "region-bot"
          git config user.email "region-bot@users.noreply.github.com"
          git add models.json regions.json artifact-models.json
          # --cached compares against the last commit, which also works the very
          # first time when the files have never been committed before.
          if git diff --cached --quiet; then
            echo "Nothing changed - nothing to commit."
          else
            MSG=$(cat promotions.txt changes.txt 2>/dev/null | head -c 200 | tr '\n' ' ')
            git commit -m "Region matrix update: ${MSG:-first run}"
            git push
            echo "Committed."
          fi
