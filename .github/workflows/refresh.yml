name: Refresh Vertex region matrix

on:
  schedule:
    - cron: '0 5 * * 1,3,5'   # Mon, Wed, Fri at 05:00 UTC (10:30 IST)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install playwright@latest
          npx playwright install --with-deps chromium

      - name: Show what's in the repo
        run: |
          echo "--- repo root ---"
          ls -la
          echo "--- everything, 2 levels deep ---"
          find . -maxdepth 2 -not -path './.git/*' -not -path './node_modules*' | sort

      - name: Scrape model pages
        run: |
          if [ ! -f scrape.mjs ]; then
            echo "::error::scrape.mjs is not at the repo root. See the file listing above for where it actually is."
            exit 1
          fi
          node scrape.mjs

      - name: Commit regions.json if it changed
        run: |
          git config user.name  "region-bot"
          git config user.email "region-bot@users.noreply.github.com"
          git add regions.json
          # --cached compares against the last commit, which also works the very
          # first time when regions.json has never been committed before.
          if git diff --cached --quiet; then
            echo "regions.json is unchanged - nothing to commit."
          else
            MSG=$(head -c 200 changes.txt 2>/dev/null | tr '\n' ' ')
            git commit -m "Region matrix update: ${MSG:-first run}"
            git push
            echo "Committed."
          fi
